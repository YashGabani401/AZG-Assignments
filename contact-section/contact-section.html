<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Contact Section For Any Query">
        <meta name="keywords" content="html, css, contact section">
        <title>Contact Section</title>
        <style>
            table {
                border-collapse: collapse;
                margin: auto;
            }   
            td {
                height: 500px;
                width: 500px;
                border: none;
                vertical-align: top;
                padding: 50px;
            }
            h2 {
                text-align: center;
                color: orangered;
                font-size:xx-large;
            }
            td:first-child {
                border-right: 1px solid black;
                border-color: orangered;
            }
            input {
                padding: 7px 7px;
            }
            textarea {
                padding-left: 10px;
            }
            input[type="text"],
            input[type="email"],
            input[type="tel"],
            textarea {
                width: 100%;             /* Makes it expand to fill its container (or use e.g. width: 400px) */
                padding: 14px 18px;      /* Makes the input taller with internal space */
                font-size: 15px;         /* Makes the typed text and placeholder larger */
                box-sizing: border-box;  /* Keeps width at exactly 100% including padding */
            }
            input::placeholder,
            textarea::placeholder {
                font-family: 'Times New Roman', Times, serif;
            }
            input:focus::placeholder, textarea:focus::placeholder {
                color: black;
            }
            h3 {
                font-size: xx-large;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                
            }
            button {
                border: 2px solid orangered;
                background-color: white;
            }
            label {
                border: 1px solid black;
                padding: 15px;
            }
        </style>
    </head>

    <body>
        <h2>CONTACT US</h2>

        <table>
            <tr>
                <td>
                    <h3>Location</h3>
                    <iframe
                        src="https://maps.google.com/maps?q=BitKhanan+IT+Education+Surat&t=&z=15&ie=UTF8&iwloc=&output=embed"
                        width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </td>
                <td>
                    <h3>Contact</h3>
                    <form>
                        <input type="text" name="yourname" placeholder="Your Name" required><br><br>
                        <input type="email" name="email" placeholder="Email" required><br><br>
                        <input type="tel" name="phonenumber" placeholder="Mobile Number" required><br><br>
                        <textarea type="text" placeholder="Message" name="message" rows="3"></textarea><br><br>
                        <label>
                            <input type="checkbox">I'm not a robot
                        </label><br><br>
                        <button type="submit">SUBMIT</button>
                    </form>
                </td>
            </tr>
        </table>
    </body>
</html>
