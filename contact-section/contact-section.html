<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Contact Section For Any Query">
        <meta name="keywords" content="html, css, contact section">
        <title>Contact Section</title>
        <style>
            table {
                border-collapse: collapse;
                margin: auto;
            }   
            td {
                height: 500px;
                width: 500px;
                border: none;
                vertical-align: top;
                padding: 50px;
            }
            h2 {
                text-align: center;
                color: #FF5A4E;
                font-size: xx-large;
            }
            td:first-child {
                border-right: 1px solid black;
                border-color: orangered;
            }
            textarea {
                padding-left: 10px;
            }
            input[type="text"],
            input[type="email"],
            input[type="tel"],
            textarea {
                width: 90%;
                padding: 10px 10px;
                font-size: 15px;
                box-sizing: border-box;
                font-weight: 500;
                color: gray;
            }
            input::placeholder,
            textarea::placeholder {
                font-family: 'Times New Roman', Times, serif;
                
            }
            input:focus::placeholder, textarea:focus::placeholder {
                color: black;
            }
            h3 {
                font-size: x-large;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: 700;
            }
            button {
                border: 3px solid #FF6052;
                background-color: white;
                display: block;
                margin: auto;
                padding: 10px 30px;
                font-weight: 600;
                color: #FF6052;
                font-size: medium;
                margin-left: 170px;
                padding-left: 32px;
            }
            label {
                border: 1px solid silver;
                padding: 20px;
                padding-right: 125px;
                color: black;
            }
            button:hover {
                background-color: #FF6052;
                color: darkblue;
            }
            input[type="text"]:invalid,
            input[type="email"]:invalid,
            input[type="tel"]:invalid {
                color: red;
            }
            input:focus, textarea:focus {
                color: black;
            }
            .section-title::before {
                content: '';
                width: 14px;
                height: 14px;
                background-color: #f05a47;
                flex-shrink: 0;
            }
            .section-title {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #222222;
            }
            .main-title {
                display: flex;
                align-items:flex-end;
                gap: 10px;
                flex-direction: column;
                align-items: center;
            }
            .main-title::after {
                content: '';
                width: 60px;
                height: 4px;
                background-color: darkblue;
            }
        </style>
    </head>

    <body>
        <h2 class="main-title">CONTACT US</h2>

        <table>
            <tr>
                <td>
                    <h3 class="section-title">Location</h3>
                    <iframe
                        src="https://maps.google.com/maps?q=BitKhanan+IT+Education+Surat&t=&z=15&ie=UTF8&iwloc=&output=embed"
                        width="100%" height="342" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </td>
                <td>
                    <h3 class="section-title">Contact</h3>
                    <form>
                        <input type="text" name="yourname" placeholder="Your Name" minlength="2" maxlength="59" pattern="[a-zA-Z]+" required><br><br>
                        <input type="email" name="email" placeholder="Email" required><br><br>
                        <input type="tel" name="phonenumber" placeholder="Mobile Number" pattern="[0-9]{10}" title="Enter a valid 10-digit number starting with 6-9." required><br><br>
                        <textarea type="text" placeholder="Message" name="message" rows="3"></textarea><br><br><br>
                        <label>
                            <input type="checkbox" required>I'm not a robot
                        </label><br><br><br><br>
                        <button type="submit">SUBMIT</button>
                    </form>
                </td>
            </tr>
        </table>
    </body>
</html>
